[project]
name = "yabitsu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pyproj>=3.8.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
